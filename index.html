<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


<title>PA#3 - Parametric Surface with Texture Mapping</title>
<style>
    body {
        background-color: #EEEEEE;
        font-family: Arial, sans-serif;
    }
</style>

<!-- Utility Libraries -->
<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>

<!-- Core Modules -->
<script src="./src/config/surfaceConfig.js"></script>
<script src="./src/core/SurfaceMath.js"></script>
<script src="./src/core/TextureManager.js"></script>
<script src="./src/core/Renderer.js"></script>

<!-- Shader Loader -->
<script src="./src/shaders/ShaderLoader.js"></script>

<!-- Model Classes -->
<script src="./src/models/BaseModel.js"></script>
<script src="./src/models/ParametricSurface.js"></script>
<script src="./src/models/SphereModel.js"></script>

<!-- Main Application -->
<script src="./src/Application.js"></script>

</head>
<body onload="init()">

<h2>Parametric Surface with Texture Mapping</h2>

<p id="message">Drag to rotate the surface. Adjust mesh density with sliders below.<br>
Surface features diffuse, specular, and normal map textures.</p>

<div style="margin: 20px 0;">
    <label for="rStepsSlider">R Steps (Radial): <span id="rStepsValue">10</span></label><br>
    <input type="range" id="rStepsSlider" min="3" max="50" value="10" style="width: 300px;">
</div>

<div style="margin: 20px 0;">
    <label for="uStepsSlider">U Steps (Angular): <span id="uStepsValue">40</span></label><br>
    <input type="range" id="uStepsSlider" min="3" max="100" value="40" style="width: 300px;">
</div>

<div id="canvas-holder">
   <canvas width="600" height="600" id="webglcanvas" style="background-color:red"></canvas>
</div>


</body></html>
