<!DOCTYPE html>
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


<title>CGW - Texture Rotation</title>
<style>
    body {
        background-color: #EEEEEE;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
    }

    #main-container {
        display: flex;
        gap: 20px;
        align-items: flex-start;
    }

    #canvas-section {
        flex-shrink: 0;
    }

    #controls-section {
        flex: 1;
        min-width: 350px;
    }

    .control-group {
        background-color: #ddd;
        border-radius: 5px;
        padding: 15px;
        margin-bottom: 15px;
    }

    .control-group h3 {
        margin-top: 0;
        margin-bottom: 15px;
        color: #333;
    }

    .control-item {
        margin-bottom: 15px;
    }

    .control-item:last-child {
        margin-bottom: 0;
    }

    .control-item label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #555;
    }

    .control-item input[type="range"] {
        width: 100%;
    }

    .slider-value {
        color: #007acc;
        font-weight: bold;
    }
</style>

<!-- Utility Libraries -->
<script src="./Utils/trackball-rotator.js"></script>
<script src="./Utils/m4.js"></script>

<!-- Core Modules -->
<script src="./src/config/surfaceConfig.js"></script>
<script src="./src/core/SurfaceMath.js"></script>
<script src="./src/core/TextureManager.js"></script>
<script src="./src/core/Renderer.js"></script>

<!-- Shader Loader -->
<script src="./src/shaders/ShaderLoader.js"></script>

<!-- Model Classes -->
<script src="./src/models/BaseModel.js"></script>
<script src="./src/models/ParametricSurface.js"></script>
<script src="./src/models/SphereModel.js"></script>

<!-- Main Application -->
<script src="./src/Application.js"></script>

</head>
<body onload="init()">

<h2>CGW - Texture Rotation on Parametric Surface</h2>

<p id="message">Drag on the canvas to rotate the surface. Use the controls on the right to adjust texture rotation and mesh density.</p>

<div id="main-container">
    <div id="canvas-section">
        <canvas width="600" height="600" id="webglcanvas" style="background-color:red"></canvas>
    </div>

    <div id="controls-section">
        <div class="control-group">
            <h3>Texture Rotation</h3>

            <div class="control-item">
                <label for="textureRotationSlider">Rotation Angle: <span class="slider-value" id="textureRotationValue">0</span>°</label>
                <input type="range" id="textureRotationSlider" min="0" max="360" value="0">
            </div>

            <div class="control-item">
                <label for="rotationCenterRSlider">Rotation Center R: <span class="slider-value" id="rotationCenterRValue">0.5</span></label>
                <input type="range" id="rotationCenterRSlider" min="0" max="100" value="50">
            </div>

            <div class="control-item">
                <label for="rotationCenterVSlider">Rotation Center V: <span class="slider-value" id="rotationCenterVValue">0.5</span></label>
                <input type="range" id="rotationCenterVSlider" min="0" max="100" value="50">
            </div>

            <div class="control-item">
                <input type="checkbox" id="showRotationCenterCheckbox" checked>
                <label for="showRotationCenterCheckbox" style="display: inline; font-weight: normal;">Show Rotation Center Point</label>
            </div>

            <div class="control-item" style="margin-top: 15px; padding: 10px; background-color: #f5f5f5; border-radius: 3px;">
                <strong>Keyboard Controls:</strong><br>
                <span style="font-size: 0.9em;">
                    <strong>W</strong> / <strong>S</strong> - Move point along R axis<br>
                    <strong>A</strong> / <strong>D</strong> - Move point along V axis
                </span>
            </div>
        </div>

        <div class="control-group">
            <h3>Mesh Density</h3>

            <div class="control-item">
                <label for="rStepsSlider">R Steps (Radial): <span class="slider-value" id="rStepsValue">50</span></label>
                <input type="range" id="rStepsSlider" min="3" max="50" value="50">
            </div>

            <div class="control-item">
                <label for="vStepsSlider">V Steps (Angular): <span class="slider-value" id="vStepsValue">100</span></label>
                <input type="range" id="vStepsSlider" min="3" max="100" value="100">
            </div>
        </div>
    </div>
</div>


</body></html>
